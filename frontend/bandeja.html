<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandeja de gestión · Solicitudes de servicio</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main>
    <h1>Bandeja de gestión</h1>
    <div id="mensaje" class="msg" role="alert"></div>
    <div class="filtros">
      <div><label for="f-estado">Estado</label><select id="f-estado"><option value="">Todos</option></select></div>
      <div><label for="f-prioridad">Prioridad</label><select id="f-prioridad"><option value="">Todas</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
      <div><label for="f-servicio">Servicio</label><select id="f-servicio"><option value="">Todos</option></select></div>
      <div><label for="f-mias">Responsable</label><select id="f-mias"><option value="">Cualquiera</option><option value="mias">Asignadas a mí</option></select></div>
    </div>
    <div id="lista"></div>
    <div class="paginacion"><button class="btn secundario" id="anterior" type="button">Anterior</button><span id="pagina"></span><button class="btn secundario" id="siguiente" type="button">Siguiente</button></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/bandeja.js"></script>
</body>
</html>
